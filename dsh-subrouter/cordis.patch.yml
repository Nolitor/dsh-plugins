# Bundle layer for @nolit/dsh-subrouter.
#
# One plugin instance registers an umbrella of model-API routes through
# ctx.llm.registerAdapter(). It never patches @deepseek-ai/dsh-llm-pi-ai and
# never mutates a canonical package. Disabling this row unloads every route
# registration, restoring the original routing table.
#
# Every OpenCode Go model is registered on both wire protocols. The two routes
# are the same model plane; pick the protocol your client speaks.
#
# Measured 2026-10-30 against https://opencode.ai/inference/go/v1:
#   - all 28 models answer on chat/completions and messages
#   - 26 emit a tool_call; muse-spark-1.2/1.3-contributor need a longer
#     reasoning budget before they emit one
#   - the OpenCode Zen plane (opencode.ai/zen/v1) is NOT registered here:
#     the account has Insufficient account funds, so those ids 402.
- insert:
    - id: dsh-subrouter
      name: '@nolit/dsh-subrouter'
      config:
        # Shared defaults for the route list below.
        provider: 'subrouter'
        displayName: 'Subrouter'
        protocol: 'openai-completions'
        baseURL: 'https://opencode.ai/inference/go/v1'
        apiKeyEnv: 'OPENCODE_API_KEY'
        apiKey: ''
        sessionHeader: 'x-opencode-session'
        sessionFallback: 'dsh-subrouter'
        anthropicVersion: '2023-06-01'
        anthropicBeta: ''
        timeoutMs: 600000
        includeUsage: true
        contextWindow: 1000000
        maxTokens: 384000
        routes:
          - provider: 'subrouter-openai'
            displayName: 'Go — OpenAI protocol'
            protocol: 'openai-completions'
            baseURL: 'https://opencode.ai/inference/go/v1'
            apiKeyEnv: 'OPENCODE_API_KEY'
            sessionHeader: 'x-opencode-session'
            sessionFallback: 'dsh-subrouter'
            models:
