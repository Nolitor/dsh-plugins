# Bundle config layer for @nolit/dsh-opencode-v2 — OpenCode v2.2.0 adapter.
#
# This is OUR layer. It is never the upstream @quonaro/dsh-plugin-opencode
# patch file, and upstream files are never modified: the adapter wraps that
# package as a dependency only.
#
# The row `id` is also the settings namespace the loader derives for volatile
# Config fields, so each id MUST equal the plugin `name` exported by its module
# (lib/index.js -> @nolit/dsh-opencode-v2, lib/provider.js -> .../provider).
#
# OPENCODE v2.2.0 NOTE: there are deliberately NO `attach` or `pure` keys here.
# v2 removed both flags — passing either makes `opencode run` exit 1 with
# "Unrecognized flag" and a usage dump on stdout, i.e. it would break every
# delegation. The plugin still ACCEPTS the keys (declared in Config) so an old
# @quonaro profile row keeps validating, but nothing ever emits them.
- insert:
  - id: dsh-opencode-v2
    name: '@nolit/dsh-opencode-v2'
    config:
      # Path or PATH-resolved name of the opencode executable. The measured
      # install is /home/minami/.bun/bin/opencode; 'opencode' stays the default
      # so the bundle is portable and PATH-resolved at spawn time.
      opencodePath: 'opencode'
      # --auto auto-approves every permission that is not explicitly denied.
      # Headless `opencode run` cannot answer prompts, so without this a run
      # stalls on the first guarded action.
      auto: true
      # Default -m provider/model. MUST be an `opencode/...` route: v2's catalog
      # is opencode/* and opencode-go/*, and the generic default is never
      # assumed to resolve.
      model: 'opencode/deepseek-v4.1-flash-free'
      # Default --agent (e.g. "build", "plan"); empty means the default agent.
      agent: ''
      # --thinking: required for v2 to emit `reasoning` events at all.
      thinking: true
      # Default --title for new sessions; empty means OpenCode chooses.
      title: ''
      # Cooperative timeout for one delegation call.
      timeoutMs: 600000
      # In-memory cap per output stream; overflow keeps the tail.
      maxOutputBytes: 1048576
      # Environment variable names forwarded to the opencode child process on
      # top of the subprocess seam's scrubbed base. OpenCode needs HOME/XDG
      # paths to find stored credentials (`opencode auth login`).
      forwardEnv:
      - PATH
      - HOME
      - USER
      - XDG_CONFIG_HOME
      - XDG_DATA_HOME
      - XDG_CACHE_HOME
      - OPENCODE_CONFIG
      - OPENCODE_SERVER_USERNAME
      - OPENCODE_SERVER_PASSWORD
      # Extra CLI flags appended verbatim before the prompt. `--attach` and
      # `--pure` are stripped defensively even if added here.
      extraArgs: []
      # Budget for the post-run `session export` usage fetch (v2 emits no
      # step_finish, so this is the only authoritative token source).
      exportTimeoutMs: 60000

  # Provider half: registers `opencode-agent` as an LLM route (Settings → Models).
  # Remove this row if you only want the delegation tool.
  - id: dsh-opencode-v2-provider
    name: '@nolit/dsh-opencode-v2/provider'
    config:
      opencodePath: 'opencode'
      auto: true
      # --thinking so reasoning streams as reasoning-delta on its own block.
      thinking: true
      # Working directory for every spawned session; empty = the harness cwd.
      cwd: ''
      timeoutMs: 1800000
      stderrMaxBytes: 65536
      forwardEnv:
      - PATH
      - HOME
      - USER
      - XDG_CONFIG_HOME
      - XDG_DATA_HOME
      - XDG_CACHE_HOME
      - OPENCODE_CONFIG
      - OPENCODE_SERVER_USERNAME
      - OPENCODE_SERVER_PASSWORD
      extraArgs: []
      models:
      - id: default
        opencodeModel: ''
        name: 'OpenCode (config default)'
      localSessionTitles: true
      # List `opencode models` for the agent's real model catalog;
      # falls back to the static `models` table on failure.
      autoDiscoverModels: true
      discoveryTimeoutMs: 60000
      # Cache a successful probe this long before re-probing.
      discoveryCacheMs: 300000
      # Budget for the post-run `session export` usage fetch.
      exportTimeoutMs: 60000
