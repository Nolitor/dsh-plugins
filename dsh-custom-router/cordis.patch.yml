# Bundle config layer for @nolit/dsh-custom-router.
#
# The row id is the settings namespace the loader derives for volatile Config
# fields, so it MUST equal the plugin name exported by lib/index.js
# (@nolit/dsh-custom-router).
#
# WHY THE SPECIFIER IS THE BARE PACKAGE NAME
#   The browser half is discovered by `@deepseek-ai/dsh-client-modules`, which
#   maps a loader row back to its package manifest with
#   `exactPackageSpecifier(row.name)`: a SCOPED SUBPATH such as
#   `@nolit/dsh-custom-router/plugin` returns undefined there, so `resolveMeta`
#   answers null and the client bundle is never registered (measured
#   2026-11-08 in an isolated boot: the settings namespace mounted, the client
#   module did not). The bare specifier needs a "." export, so package.json
#   declares one; the specifier and the plugin's own `name` export are now the
#   same package name.
#
# WHAT THIS ROW DOES
#   Mounts the three provider presets as CHILD plugins. It deliberately does not
#   re-implement them: each preset names the loader rows it owns, and the router
#   mounts each row's own plugin with that row's own config.
#
# THIS ROW MUST NOT COEXIST WITH THE VENDOR BUNDLE ROWS
#   A profile that still lists @nolit/dsh-antigravity, @nolit/dsh-deepinfra or
#   @nolit/dsh-opencode-v2 mounts the same plugins twice, which is a hard mount
#   failure (duplicate provider/tool registrations). Remove those bundle rows
#   before enabling this one.
#
# NO SECRETS HERE
#   The live per-row config (API keys, tokens, daemon paths) is the operator's
#   and lives in the profile's own patch layer, keyed by ROW id and passed
#   through `vendorConfig`. This file carries switches only.
- insert:
  - id: dsh-custom-router
    name: '@nolit/dsh-custom-router'
    config:
      # A malformed declaration throws before anything mounts. Leave on: a
      # silently skipped preset looks exactly like a provider that never shipped.
      strict: true
      # Opt-in by design (see above): every preset starts unmounted.
      presets:
        antigravity: false
        deepinfra: false
        opencode: false

# THE SUBAGENT MODEL ALLOWLIST — the repo-side default
#
#   The host's `subagent-model-selection-settings` row decides which
#   `provider/model` routes a delegated child may pick. It is a HOST-owned
#   settings namespace (`@deepseek-ai/dsh-tool-subagent/model-selection-settings`),
#   not one of this bundle's own rows, so a fresh profile has to be given the
#   default explicitly. This bundle layer states it; a profile's own
#   `cordis.patch.yml` overrides the row wholesale, so an operator's list wins.
#
#   The route ids name the PRESET's provider id (`provider`) and the model id
#   the preset serves (`model`) — the same shape the Settings page writes. The
#   provider ids are pinned by `test/preset-surfaces.test.mjs`.
- id: subagent-model-selection-settings
  name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
  config:
    enabled: true
    allowedModels:
      - provider: antigravity
        model: gemini-4-hydrogen
      - provider: antigravity
        model: gemini-4-argon
      - provider: antigravity
        model: claude-opus-5-5
      - provider: opencode-http-agent
        model: opencode-go/deepseek-v4.1-flash
      - provider: opencode-http-agent
        model: opencode-go/minimax-m3.1-flash
      - provider: deepinfra
        model: deepseek-ai/DeepSeek-V4.1-Flash-1017
      - provider: exaone
        model: k-exaone_v2.5
