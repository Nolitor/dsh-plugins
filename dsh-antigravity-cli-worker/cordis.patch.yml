# Bundle config layer for @nolit/dsh-antigravity-cli-worker — Antigravity CLI worker tool.
#
# Registers one tool, `agy_worker`, that runs a single isolated `agy` call per
# invocation. The row id must match the package name's plugin id.
- insert:
    - id: dsh-antigravity-cli-worker
      name: '@nolit/dsh-antigravity-cli-worker'
      config:
        # Path or PATH-resolved name of the agy executable.
        agyPath: agy
        # gemini-3.8-flash-low carries gemini-3.8-flash with low thinking effort.
        model: gemini-3.8-flash-low
        effort: low
        timeoutMs: 600000
        maxOutputBytes: 262144
        artifactLimit: 100
        workerEnabled: true
        forwardEnv:
          - PATH
          - HOME
          - USER
          - XDG_CONFIG_HOME
          - XDG_DATA_HOME
          - XDG_CACHE_HOME
          - GEMINI_CONFIG_DIR
          - GOOGLE_APPLICATION_CREDENTIALS
        extraArgs: []
